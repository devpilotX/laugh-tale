# LaughTail SMP - Paper / Spigot / Bukkit managed tuning
#
# THE MODEL: this file does not replace Paper's config files. It lists the exact
# keys this project OWNS. Everything else is left to Paper's defaults.
#
# Why a managed subset rather than shipping whole YAML files from the repository,
# which is what Section 29 might suggest at first reading:
#
#   1. Paper adds, renames and moves keys between versions. A repository copy of a
#      whole config file goes stale silently and, worse, would re-introduce old
#      defaults on upgrade - the file would win over Paper's new baseline.
#   2. Paper rewrites these files on boot and on config migration, so a
#      byte-for-byte model produces permanent false drift, exactly as measured for
#      server.properties in D-0015.
#   3. A managed subset is reviewable. Twelve deliberate keys with reasons is
#      auditable; 400 keys copied from a default file is not, and hides which ones
#      were actually decisions.
#
# The applier REFUSES to create a key that does not already exist in the live
# file. That is the important safety property: Paper ignores unknown keys without
# any error, so a typo'd or renamed path would look applied and do nothing.
#
# Drift is checked on these keys only, by scripts/remote/check-paper-drift.sh.

managed:

  # --- measurement, spec 6.7 and Law 5 ---------------------------------------
  # Without this the whole measurement toolchain in 6.3 and 6.7 is unavailable:
  # every spark subcommand answers "The spark profiler is currently disabled",
  # which is exactly what blocked the deviation D2 baseline and forced it to fall
  # back to Paper's /tps and /mspt. Rows 19, 20, 25 and 60 all need spark.
  - file: config/paper-global.yml
    key: spark.enabled
    value: true
    type: bool
    why: "6.7 names spark as the measurement toolchain; it is bundled with Paper but off by default"

  # Left false deliberately: the profiler should be started on demand, not kept
  # running. An always-on profiler costs CPU on a 2 vCPU box for data nobody is
  # reading, and 6.3 describes spark as something you invoke against real load.
  - file: config/paper-global.yml
    key: spark.enable-immediately
    value: false
    type: bool
    why: "on-demand profiling only; an always-on profiler spends tick budget on unread data"

  # --- autosave staggering, spec 6.4 -----------------------------------------
  # 6.4: "Autosave: stagger it, and never let plugin saves and world saves land on
  # the same tick." Chunk autosave runs at 6000 ticks. Player autosave at rate -1
  # inherits bukkit's ticks-per.autosave, which is ALSO 6000 - so both landed on
  # the same tick every five minutes, which is precisely what 6.4 forbids.
  # 5000 and 6000 coincide only every 30000 ticks (25 minutes) instead of every
  # 6000, and max-per-tick spreads the player writes instead of doing them at once.
  - file: config/paper-global.yml
    key: player-auto-save.rate
    value: 5000
    type: int
    why: "6.4 stagger requirement: was -1, which inherited 6000 and collided with chunk autosave every 5 minutes"

  - file: config/paper-global.yml
    key: player-auto-save.max-per-tick
    value: 5
    type: int
    why: "was -1 (unlimited); spreads player writes so a save does not land as one spike"

  # --- hoppers, spec 6.4 gives these exact numbers ---------------------------
  # 6.4: "ticks-per.hopper-transfer and hopper-check: raise from 8 to 16. Hoppers
  # get slightly slower; hopper CPU roughly halves." This is the one place the
  # specification states before-and-after values, so it is applied verbatim.
  - file: spigot.yml
    key: world-settings.default.ticks-per.hopper-transfer
    value: 16
    type: int
    why: "6.4 states 8 to 16 explicitly; roughly halves hopper CPU"

  - file: spigot.yml
    key: world-settings.default.ticks-per.hopper-check
    value: 16
    type: int
    why: "6.4 states 8 to 16 explicitly"

# ---------------------------------------------------------------------------
# ALREADY SATISFIED BY PAPER'S DEFAULTS - verified, not assumed
# ---------------------------------------------------------------------------
# Section 6.4 was written against an older Paper. These recommendations are
# already true out of the box on 1.21.11, confirmed by reading the live files
# with scripts/remote/paper-config-paths.sh. Recorded so nobody "fixes" them
# again and so the spec's checklist can be closed honestly:
#
#   hopper.disable-move-event                = true              (6.4 asks for true)
#   misc.redstone-implementation             = ALTERNATE_CURRENT (6.4 "Paper's optimised option")
#   misc.update-pathfinding-on-block-update  = false             (a large mob-AI win)
#   entities.spawning.per-player-mob-spawns  = true              (fair spawns, lower total mobs)
#   chunks.prevent-moving-into-unloaded-chunks = true
#   chunk-loading-basic.player-max-chunk-generate-rate = 8.0     (6.4 "cap per tick" already met)
#   merge-radius.item = 4.0, merge-radius.exp = 6.0              (6.4 "increase modestly" - already above Spigot's 2.5/3.0)
#   settings.save-user-cache-on-stop-only    = true
#
# ---------------------------------------------------------------------------
# DELIBERATELY NOT CHANGED YET - Law 5, measurement precedes tuning
# ---------------------------------------------------------------------------
# 6.4 also advises reducing entity activation and tracking ranges and tuning mob
# spawn limits down. Those are NOT applied here, on purpose:
#
#   The measured idle MSPT is 0.2 ms against a 25 ms budget (baselines.md B1).
#   There is no measured CPU shortage to fix. Reducing activation ranges trades
#   visible gameplay fidelity - mobs beyond the range stop moving while a player
#   can still see them - for CPU that is not currently scarce. Law 5 and 6.8 both
#   say measurement precedes tuning, and Phase 6 is where these get set from the
#   load test rather than from a blog post.
#
#   Candidates, with current values, for Phase 6 to decide with evidence:
#     spigot   world-settings.default.entity-activation-range.monsters   24
#     spigot   world-settings.default.entity-activation-range.animals    16
#     spigot   world-settings.default.entity-activation-range.misc        8
#     spigot   world-settings.default.entity-tracking-range.monsters     48
#     bukkit   spawn-limits.monsters                                     50
#     bukkit   ticks-per.monster-spawns                                   4
#     paper    chunks.delay-chunk-unloads-by                            10s
#     paper    chunk-loading-basic.player-max-chunk-generate-rate        8.0
#
#   The one genuine argument for acting early is memory rather than CPU: fewer
#   entities means fewer chunk-save bytes and less heap churn, and memory IS
#   scarce here (519 MB available, Q-41). That argument should be settled with the
#   load test, not asserted now.
